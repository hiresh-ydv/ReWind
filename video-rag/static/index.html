<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewind — Course Video Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1220;
    --surface: #141B2E;
    --surface-hover: #1B2540;
    --line: #232D46;
    --text: #E8ECF4;
    --text-dim: #8A93A8;
    --amber: #E8A33D;
    --amber-dim: #E8A33D33;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 100px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 2.6rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  header p {
    color: var(--text-dim);
    font-size: 1rem;
    margin: 0;
    max-width: 46ch;
  }

  /* Search */
  .search-row {
    display: flex;
    gap: 10px;
    margin-top: 32px;
  }

  #searchBox {
    flex: 1;
    padding: 14px 16px;
    font-size: 0.98rem;
    font-family: inherit;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }

  #searchBox:focus {
    border-color: var(--amber);
  }

  #searchBox::placeholder {
    color: var(--text-dim);
  }

  #searchBtn {
    padding: 14px 22px;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 500;
    background: var(--amber);
    color: #1A1200;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  #searchBtn:hover { filter: brightness(1.08); }
  #searchBtn:focus-visible, #searchBox:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Loading */
  #loading {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  #loading.active { display: flex; }
  .pulse-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Answer */
  #answerWrap { display: none; margin-top: 36px; }
  #answerWrap.active { display: block; }

  #answer {
    border-left: 2px solid var(--amber);
    padding: 4px 0 4px 18px;
    line-height: 1.7;
    font-size: 1rem;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* Player */
  #playerSection { display: none; margin-top: 32px; }
  #playerSection.active { display: block; }

  #nowPlaying {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  #nowPlaying .mono {
    font-family: 'JetBrains Mono', monospace;
    color: var(--amber);
  }

  #player iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--line);
  }

  .fallback-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-dim);
  }
  .fallback-link:hover { color: var(--amber); border-color: var(--amber); }

  /* Timeline of matches */
  #matchesSection { display: none; margin-top: 44px; }
  #matchesSection.active { display: block; }

  #matchesSection h2 {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 20px;
  }

  .timeline {
    position: relative;
    padding-left: 22px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }

  .match {
    position: relative;
    padding: 10px 14px 10px 16px;
    margin-bottom: 6px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .match:hover, .match:focus-visible { background: var(--surface); }
  .match:focus-visible { outline: 1px solid var(--amber); }

  .match::before {
    content: "";
    position: absolute;
    left: -22px;
    top: 17px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--text-dim);
  }
  .match.active::before {
    border-color: var(--amber);
    background: var(--amber);
  }

  .match-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--amber);
    margin-right: 10px;
  }
  .match-title {
    font-size: 0.92rem;
    font-weight: 500;
  }
  .match-snippet {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }

  @media (max-width: 500px) {
    h1 { font-size: 2.1rem; }
    .search-row { flex-direction: column; }
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>Rewind</h1>
    <p>Ask what you're trying to recall, and jump straight to the moment your course covered it.</p>
  </header>

  <div class="search-row">
    <input type="text" id="searchBox" placeholder="e.g. What is temperature in AI?" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div id="loading"><span class="pulse-dot"></span> Searching your lectures…</div>

  <div id="answerWrap">
    <div id="answer"></div>
  </div>

  <div id="playerSection">
    <div id="nowPlaying"></div>
    <div id="player"></div>
  </div>

  <div id="matchesSection">
    <h2>Also mentioned in</h2>
    <div class="timeline" id="matches"></div>
  </div>
</main>

<script>
const searchBox = document.getElementById("searchBox");
const searchBtn = document.getElementById("searchBtn");
const answerWrap = document.getElementById("answerWrap");
const answerDiv = document.getElementById("answer");
const matchesSection = document.getElementById("matchesSection");
const matchesDiv = document.getElementById("matches");
const playerSection = document.getElementById("playerSection");
const playerDiv = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");
const loadingDiv = document.getElementById("loading");

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

async function doSearch() {
  const query = searchBox.value.trim();
  if (!query) return;

  loadingDiv.classList.add("active");
  answerWrap.classList.remove("active");
  matchesSection.classList.remove("active");
  playerSection.classList.remove("active");
  matchesDiv.innerHTML = "";

  try {
    const res = await fetch("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const data = await res.json();

    answerDiv.textContent = data.answer;
    answerWrap.classList.add("active");

    data.matches.forEach((m, idx) => {
      const cleanText = m.text.replace("passage: ", "");
      const el = document.createElement("div");
      el.className = "match" + (idx === 0 ? " active" : "");
      el.tabIndex = 0;
      el.innerHTML = `
        <span class="match-time">${formatTime(m.start_time)}</span>
        <span class="match-title">${m.video_title}</span>
        <div class="match-snippet">${cleanText.slice(0, 130)}…</div>
      `;
      const play = () => {
        document.querySelectorAll(".match").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        playVideo(m.video_id, Math.floor(m.start_time), m.video_title);
      };
      el.onclick = play;
      el.onkeydown = (e) => { if (e.key === "Enter") play(); };
      matchesDiv.appendChild(el);
    });

    if (data.matches.length > 0) {
      matchesSection.classList.add("active");
      const first = data.matches[0];
      playVideo(first.video_id, Math.floor(first.start_time), first.video_title);
    }
  } catch (err) {
    answerDiv.textContent = "Something went wrong: " + err;
    answerWrap.classList.add("active");
  } finally {
    loadingDiv.classList.remove("active");
  }
}

function playVideo(videoId, startSeconds, title) {
  nowPlaying.innerHTML = `Now playing — <span class="mono">${formatTime(startSeconds)}</span> · ${title}`;
  playerDiv.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${videoId}?start=${startSeconds}&autoplay=1&mute=1"
      frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>
    <a class="fallback-link" href="https://youtu.be/${videoId}?t=${startSeconds}" target="_blank">
      Not playing? Open on YouTube ↗
    </a>`;
  playerSection.classList.add("active");
}

searchBtn.onclick = doSearch;
searchBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});
</script>

</body>
</html>
